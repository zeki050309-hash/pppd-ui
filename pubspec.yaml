name: promptear
description: Sound recognition app for hearing impaired (청각장애인용 소리 감지 앱)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # ── Firebase ──────────────────────────────────────────────────
  firebase_core: 3.14.0
  firebase_core_platform_interface: 5.4.0
  firebase_core_web: 2.23.0
  cloud_firestore: 5.6.9
  cloud_firestore_platform_interface: 6.6.9
  cloud_firestore_web: 4.4.9
  firebase_performance: 0.10.1+7
  firebase_performance_platform_interface: 0.1.5+7
  firebase_performance_web: 0.1.7+13

  # ── Maps & Location ──────────────────────────────────────────
  google_maps_flutter: 2.12.2
  google_maps_flutter_android: 2.16.1
  google_maps_flutter_ios: 2.15.2
  google_maps_flutter_platform_interface: 2.12.1
  google_maps_flutter_web: 0.5.12
  google_maps: 8.1.1
  geolocator: ^13.0.2

  # ── UI / FlutterFlow ─────────────────────────────────────────
  auto_size_text: 3.0.0
  cached_network_image: 3.4.1
  cached_network_image_platform_interface: 4.1.1
  cached_network_image_web: 1.3.1
  collection: 1.19.1
  dropdown_button2:
    git:
      url: https://github.com/FlutterFlow/dropdown_button2.git
      ref: 514178337dfbea442f617daed39c704b57593fc9
      path: packages/dropdown_button2
  flutter_animate: 4.5.0
  flutter_cache_manager: 3.4.1
  flutter_plugin_android_lifecycle: 2.0.28
  font_awesome_flutter: 10.7.0
  from_css_color: 2.0.0
  go_router: 12.1.3
  google_fonts: 6.3.3
  page_transition: ^2.2.2
  percent_indicator: 4.2.2
  plugin_platform_interface: 2.1.8
  intl: 0.20.2
  json_path: 0.7.2
  stream_transform: 2.1.0
  timeago: 3.7.1
  url_launcher: 6.3.1
  url_launcher_android: 6.3.16
  url_launcher_ios: 6.3.3
  url_launcher_linux: 3.2.1
  url_launcher_macos: 3.2.2
  url_launcher_platform_interface: 2.3.2
  url_launcher_web: 2.4.1
  url_launcher_windows: 3.1.4

  # ── State / Prefs ────────────────────────────────────────────
  provider: 6.1.5
  shared_preferences: 2.5.3
  shared_preferences_android: 2.4.10
  shared_preferences_foundation: 2.5.4
  shared_preferences_linux: 2.4.1
  shared_preferences_platform_interface: 2.4.1
  shared_preferences_web: 2.4.3
  shared_preferences_windows: 2.4.1

  # ── Storage / Path ───────────────────────────────────────────
  path_provider: 2.1.4
  path_provider_android: 2.2.10
  path_provider_foundation: 2.4.0
  path_provider_linux: 2.2.1
  path_provider_platform_interface: 2.1.2
  path_provider_windows: 2.3.0

  # ── PromptEar 핵심 (오디오 · 진동 · HTTP) ─────────────────────
  # record: 웹(getUserMedia) + Android/iOS 오디오 녹음
  # iOS 빌드 호환을 위해 ^6.2.0 (5.x는 최신 Xcode/iOS에서 빌드 문제)
  record: ^6.2.0
  # vibration: 모바일 전용 — lib 코드에서 kIsWeb 가드로 감쌈
  vibration: ^1.9.0
  http: 1.4.0
  # flutter_local_notifications: 로컬 알림 → Apple Watch / Wear OS 자동 미러링
  flutter_local_notifications: ^18.0.1

  cupertino_icons: ^1.0.0

dependency_overrides:
  http: 1.4.0
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0
  lints: 4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/images/images/   # pppd-ui 원본 경로 호환
    - assets/videos/
    - assets/audios/
    - assets/rive_animations/
    - assets/pdfs/
    - assets/jsons/
